<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>無題</title>
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <div id="app">
    <header id="menubar">
      <!-- メニューの項目は main.js の MENUS（ファイル：新規・開く・保存・名前を付けて保存、
           表示：アウトライン・ステータスバーの表示の切り替え） -->
      <button id="menu-file" title="ファイル (Alt+F)">ファイル(F)</button>
      <button id="menu-view" title="表示 (Alt+V)">表示(V)</button>
      <button data-cmd="find" title="検索と置換 (Ctrl+F)">検索と置換</button>
      <!--<span class="sep"></span>-->
      <button data-cmd="about" title="バージョン情報">バージョン情報</button>
    </header>
    <main id="body">
      <!-- フォルダビュー（「ファイル」→「フォルダを開く...」で開いた時だけ表示する。main.js・folder.js） -->
      <nav id="folder" aria-label="フォルダ">
        <div class="pane-header"><span id="folder-title" class="pane-title">フォルダ</span>
          <button id="folder-reopen" title="別のフォルダを開く">…</button></div>
        <ul id="folder-tree"></ul>
      </nav>
      <div id="folder-splitter" title="ドラッグで幅を変更（ダブルクリックで元の幅に戻す）"></div>
      <nav id="outline" aria-label="アウトライン"><div class="pane-title">アウトライン</div><ul id="outline-list"></ul></nav>
      <div id="splitter" title="ドラッグで幅を変更（ダブルクリックで元の幅に戻す）"></div>
      <section id="editor-wrap"><div id="doc"></div>
        <!-- ソースモード（「表示」→「ソースモード」）：Markdown のソースを直接編集する入力欄と、その後ろに重ねて
             検索の色・行の位置に使う要素（main.js の setSourceMode） -->
        <div id="source-wrap"><div id="source-backdrop" aria-hidden="true"></div><textarea id="source" spellcheck="false" aria-label="Markdown のソース"></textarea></div>
      </section>
    </main>
    <footer id="statusbar">
      <span id="status-dirty"></span>
      <!-- 停止・入力遅延の回数は、Debug ビルドの時だけ表示する（main.js の startStallMonitor） -->
      <span id="status-stall" class="debug-only" title="画面の処理が200ms以上止まった回数（IMEフリーズ検証用）">停止 0回</span>
      <span id="status-lag" class="debug-only" title="キー入力が画面に届くまで200ms以上かかった回数（IMEフリーズ検証用）">入力遅延 0回</span>
      <span id="status-link"></span>
      <span id="status-host"></span>
    </footer>
  </div>
  <!-- 検索と置換（Ctrl+F・メニューバーの「検索と置換」。find.js） -->
  <div id="find-panel" role="dialog" aria-label="検索と置換" hidden>
    <div id="find-header"><span>検索と置換</span><button id="find-close" title="閉じる (Esc)">×</button></div>
    <div class="find-body">
      <label for="find-query">検索する文字列</label>
      <input id="find-query" type="text" spellcheck="false" autocomplete="off" />
      <details id="find-replace-box">
        <summary>置換後の文字列</summary>
        <input id="find-replacement" type="text" spellcheck="false" autocomplete="off" />
      </details>
      <div class="find-row"><span class="find-label">対象範囲</span>
        <label><input type="radio" name="find-scope" id="find-scope-file" checked />現在のファイル</label>
        <label><input type="radio" name="find-scope" id="find-scope-folder" />フォルダ全体（サブフォルダ含む）</label>
      </div>
      <div class="find-row">
        <label><input type="checkbox" id="find-case" />大文字・小文字を区別する</label>
        <label><input type="checkbox" id="find-regex" />正規表現を使用する</label>
      </div>
      <div class="find-buttons">
        <button id="find-prev">前を検索</button><button id="find-next">次を検索</button><button id="find-all" class="default">すべて検索</button>
        <button id="find-step-replace" hidden>1件ずつ置換…</button><button id="find-replace-all" hidden>すべて置換</button>
      </div>
      <div id="find-status"></div>
      <ul id="find-results" hidden></ul>
      <div id="find-step" hidden>
        <div id="find-step-file"></div>
        <div id="find-step-context"></div>
        <div class="find-buttons">
          <button id="find-step-do">置換</button><button id="find-step-skip">スキップ</button>
          <button id="find-step-rest">残りをすべて置換</button><button id="find-step-end">終了</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
